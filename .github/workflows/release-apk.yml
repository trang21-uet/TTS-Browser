name: Release APK

# Publishes a signed APK as a GitHub release whenever a push to main changes
# versionName/versionCode in app/build.gradle.kts.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
      version_name: ${{ steps.check.outputs.version_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          read_version() {
            local gradle
            gradle=$(cat)
            local name code
            name=$(echo "$gradle" | grep -m1 'versionName' | sed 's/.*"\(.*\)".*/\1/')
            code=$(echo "$gradle" | grep -m1 'versionCode' | grep -oE '[0-9]+')
            echo "${name}+${code}"
          }
          NEW_VERSION=$(read_version < app/build.gradle.kts)
          OLD_VERSION=$(git show "${{ github.event.before }}:app/build.gradle.kts" 2>/dev/null | read_version || true)
          echo "old version: $OLD_VERSION"
          echo "new version: $NEW_VERSION"
          if [ "$NEW_VERSION" != "$OLD_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_name=${NEW_VERSION%%+*}" >> "$GITHUB_OUTPUT"

      # An empty secret is stored happily by GitHub, so fail fast here rather
      # than after the build with an unsigned APK.
      - name: Verify signing secrets
        if: steps.check.outputs.changed == 'true'
        env:
          TTS_KEYSTORE_BASE64: ${{ secrets.TTS_KEYSTORE_BASE64 }}
          TTS_KEYSTORE_PASSWORD: ${{ secrets.TTS_KEYSTORE_PASSWORD }}
          TTS_KEY_ALIAS: ${{ secrets.TTS_KEY_ALIAS }}
          TTS_KEY_PASSWORD: ${{ secrets.TTS_KEY_PASSWORD }}
        run: |
          for v in TTS_KEYSTORE_BASE64 TTS_KEYSTORE_PASSWORD TTS_KEY_ALIAS TTS_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is empty or unset. Re-add it with: gh secret set $v"
              exit 1
            fi
          done

  build:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TTS_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TTS_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          TTS_KEYSTORE_PASSWORD: ${{ secrets.TTS_KEYSTORE_PASSWORD }}
          TTS_KEY_ALIAS: ${{ secrets.TTS_KEY_ALIAS }}
          TTS_KEY_PASSWORD: ${{ secrets.TTS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/TTS-Browser-${{ needs.check-version.outputs.version_name }}.apk

      # The release body is this version's section of docs/project-changelog.md,
      # up to the next "## [" heading.
      - name: Extract release notes
        run: |
          awk -v marker="## [${{ needs.check-version.outputs.version_name }}]" '
            index($0, marker) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' docs/project-changelog.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Phiên bản ${{ needs.check-version.outputs.version_name }}" > release-notes.md
          fi
          cat release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version_name }}
          name: TTS Browser ${{ needs.check-version.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: app/build/outputs/apk/release/TTS-Browser-${{ needs.check-version.outputs.version_name }}.apk
